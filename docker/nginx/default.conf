# Ludus UX — TLS terminates here; upstream is plain HTTP on ludus-ux:3000.
# Use Docker embedded DNS + upstream resolve so nginx survives ludus-ux recreate
# (static upstream hostnames are resolved once at nginx start and fail if absent).
resolver 127.0.0.11 valid=10s ipv6=off;

# Empty Upgrade must not become Connection: close. SSE has no Upgrade header,
# and Connection: close makes nginx finish the upstream response before the
# first event, which the browser reports as a failed EventSource.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Keep the client's port in Host. On an 8443:443 mapping $host drops it, so
# redirects, the app origin check, and Next Server Actions see the wrong origin.
map $http_host $lux_forward_host {
    ""      $host;
    default $http_host;
}

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=10r/m;

upstream lux_upstream {
    zone lux_upstream 64k;
    server ludus-ux:3000 resolve;
    keepalive 32;
}

server {
    listen 443 ssl http2;
    server_name _;

    server_tokens off;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size    500m;
    client_body_timeout      300s;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    proxy_read_timeout       86400s;
    proxy_send_timeout       86400s;
    proxy_connect_timeout    60s;
    proxy_buffering          off;
    proxy_request_buffering  off;

    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        proxy_pass http://lux_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $lux_forward_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Long-lived text/event-stream responses. gzip and buffering hold the first
    # byte until the handler closes, and the dashboard then reconnects forever.
    location ~ ^/api/(logs/stream|admin/app-logs/stream|goad/tasks/events|goad/execute|goad/tasks/[^/]+/stream)$ {
        proxy_pass http://lux_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $lux_forward_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        gzip off;
    }

    location / {
        proxy_pass http://lux_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $lux_forward_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
