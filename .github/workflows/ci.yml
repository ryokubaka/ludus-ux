# Each check is a script in scripts/ci/, so .gitlab/ci.yml and a developer
# machine run exactly the same commands. Job names match the GitLab jobs.
# The live security suite cannot run here (public runners cannot reach a lab);
# it runs from scripts/ci/live-security.sh and posts the security-gate/live status.
# See docs/security-testing.md.

name: CI

on:
  pull_request:
  push:
    branches: [main, master, dev, init-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# trivy-action@v0.35.0 pins actions/cache@v4 (Node 20). Opt into Node 24 for JS actions until
# upstream bumps the pin (see https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit:
    runs-on: ubuntu-latest
    env:
      # A runner that cannot run these tests fails instead of skipping them.
      LUX_TEST_REQUIRE_CAPS: userns,pyyaml,visudo,nonroot
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - name: OS deps (better-sqlite3, lux-host tests)
        run: sudo apt-get update && sudo apt-get install -y python3 make g++ python3-yaml
      # Ubuntu 24.04 AppArmor blocks the unprivileged user namespaces the
      # lux-host tests use to fake a root-owned /usr/local/sbin.
      - name: Allow unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bash scripts/ci/unit.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - run: bash scripts/ci/security.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: security-checklist
          path: security-checklist-part.json
          if-no-files-found: ignore

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: bash scripts/ci/hygiene.sh

  changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - run: bash scripts/ci/changelog.sh

  # Ticks the security checklist on the pull request from the security and
  # changelog results. Runs after those jobs even when one of them failed.
  security-checklist:
    needs: [security, changelog]
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      statuses: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: security-checklist
          path: .
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      - name: Update the security checklist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          LUX_COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
          LUX_CHANGELOG_RESULT: ${{ needs.changelog.result }}
        run: bash scripts/ci/security-checklist.sh

  npm-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y python3 make g++
      - run: bash scripts/ci/npm-audit.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: bash scripts/ci/secrets.sh

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash scripts/ci/sast.sh

  # GitHub only: GitLab CE has no CodeQL equivalent. Semgrep (sast) covers both.
  codeql:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          # Code scanning does not apply // codeql[...] comments. Write the SARIF,
          # drop covered results, then upload that file as this job's category.
          upload: never
          output: codeql-results
          post-processed-sarif-path: codeql-sarif
      - run: node scripts/ci/codeql-apply-suppressions.mjs codeql-sarif
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: codeql-sarif
          category: .github/workflows/ci.yml:codeql

  trivy-fs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: "."
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-dirs: node_modules,.next,.git

  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash scripts/ci/image.sh

  smoke:
    runs-on: ubuntu-latest
    needs: [build-image]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: bash scripts/ci/smoke.sh

  trivy-image:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: docker build -f docker/Dockerfile -t ludus-ux:ci .
      - uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          image-ref: ludus-ux:ci
          severity: CRITICAL,HIGH
          exit-code: "1"
