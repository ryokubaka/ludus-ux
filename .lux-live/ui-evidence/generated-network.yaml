ludus:
  - vm_name: "{{ range_id }}-DC"
    hostname: dc
    vlan: 10
network:
  rules:
    - name: allow-443
      vlan_src: 10
      vlan_dst: 10
      protocol: tcp
      ports: 443
      action: ACCEPT
    - name: Allow targets to SO Fleet
      vlan_src: 10
      vlan_dst: 20
      protocol: tcp
      ports: 8220
      action: ACCEPT
    - name: Allow clients to DC
      vlan_src: 10
      vlan_dst: 10
      protocol: tcp
      ports: 445
      action: ACCEPT
  inter_vlan_default: DROP
