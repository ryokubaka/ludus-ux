rules:
  - id: lux-secret-in-command-string
    languages: [typescript]
    severity: ERROR
    message: >-
      A secret-named value reaches the command string of an SSH or child process
      call. The remote shell's argv is readable with `ps` by any user on that
      host. Send the secret on stdin (`{ stdin }`) or write it to a 0600 file.
    mode: taint
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern: $X
              - pattern: $O.$X
          - metavariable-regex:
              metavariable: $X
              regex: (?i)^(pass|\w*(apikey|api_key|password|passwd|secret|token|auth))$
      # Quoting keeps the secret in the command.
      - patterns:
          - pattern: $Q(..., <... $X ...>, ...)
          - metavariable-regex:
              metavariable: $Q
              regex: ^(shellQuote|shq|sq|quote|String|JSON\.stringify)$
          - metavariable-regex:
              metavariable: $X
              regex: (?i)^(pass|\w*(apikey|api_key|password|passwd|secret|token|auth))$
    pattern-sanitizers:
      - pattern: $F.length
      - pattern: "!$X"
      # Passing a key to a helper (listing templates, building a stdin step)
      # does not put it in the result. Quoting and string helpers do.
      - patterns:
          - pattern: $F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(?!(shellQuote|shq|quote|String|encodeURIComponent|JSON\.stringify|sshExec\w*|execSync|spawn\w*|execFile\w*)$|.*\.(exec|replace|replaceAll|trim|toString|concat|join|slice|padStart|padEnd)$).*$
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: sshExec($CMD, ...)
              - pattern: sshExecAccount($CMD, ...)
              - pattern: sshExecAsWorkspaceUser($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: spawn($BIN, $CMD, ...)
              - pattern: spawnSync($BIN, $CMD, ...)
              - pattern: execFile($BIN, $CMD, ...)
              - pattern: execFileSync($BIN, $CMD, ...)
          - focus-metavariable: $CMD
      - patterns:
          - pattern: $CONN.exec($CMD, ...)
          - metavariable-regex:
              metavariable: $CONN
              regex: (?i)^(conn|client|ssh\w*)$
          - focus-metavariable: $CMD
