services:
  ludus-ux:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: ludus-ux
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      # Auth: SSH host for user login + .bashrc API key reads
      - LUDUS_SSH_HOST=${LUDUS_SSH_HOST}
      - LUDUS_SSH_PORT=${LUDUS_SSH_PORT:-22}
      # Optional: IP address of the Ludus server, used when LUDUS_SSH_HOST is a hostname
      # that Docker cannot resolve (VPN-only DNS, Windows hosts file entries, etc.).
      # Set this in your .env and the container will add the mapping to /etc/hosts automatically.
      - LUDUS_SERVER_IP=${LUDUS_SERVER_IP:-}
      # Session encryption secret (required in production: min 32 chars, not a placeholder — see docs/environment.md)
      - APP_SECRET=${APP_SECRET:-change-me-in-production}
      # Lab-only: accept self-signed TLS to Ludus/PocketBase/Proxmox. Omit or false in hardened production (use NODE_EXTRA_CA_CERTS).
      - LUDUS_TLS_INSECURE=${LUDUS_TLS_INSECURE:-true}
      # Ludus API — defaults from LUDUS_SSH_HOST; override LUDUS_URL / LUDUS_ADMIN_URL in .env if needed.
      - LUDUS_URL=${LUDUS_URL:-https://${LUDUS_SSH_HOST}:8080}
      - LUDUS_ADMIN_URL=${LUDUS_ADMIN_URL:-https://${LUDUS_SSH_HOST}:8081}
      # ROOT API key for Ludus v2 admin operations (user management)
      - LUDUS_ROOT_API_KEY=${LUDUS_ROOT_API_KEY:-}
      # Proxmox root SSH for pvesh / admin tunnel / privileged ops (key preferred on hardened PVE)
      - PROXMOX_SSH_USER=${PROXMOX_SSH_USER:-root}
      - PROXMOX_SSH_PASSWORD=${PROXMOX_SSH_PASSWORD:-}
      - PROXMOX_SSH_KEY_PATH=${PROXMOX_SSH_KEY_PATH:-/app/ssh/id_rsa}
      - PROXMOX_SSH_KEY_PASSPHRASE=${PROXMOX_SSH_KEY_PASSPHRASE:-}
      # GOAD integration
      - GOAD_SSH_HOST=${LUDUS_SSH_HOST}
      - GOAD_SSH_PORT=${LUDUS_SSH_PORT:-22}
      - GOAD_SSH_USER=${GOAD_SSH_USER:-}
      - GOAD_SSH_PASSWORD=${GOAD_SSH_PASSWORD:-}
      - GOAD_SSH_KEY_PATH=${GOAD_SSH_KEY_PATH:-/app/ssh/id_rsa}
      - GOAD_PATH=${GOAD_PATH:-/opt/GOAD}
      - LUDUS_INSTALL_PATH=${LUDUS_INSTALL_PATH:-/opt/ludus}
      - ENABLE_GOAD=${ENABLE_GOAD:-true}
      - LUDUS_ANSIBLE_VERBOSE=${LUDUS_ANSIBLE_VERBOSE:-true}
      # In-app AI assistant (OpenAI-compatible / optional Ollama profile)
      - ENABLE_AI_ASSISTANT=${ENABLE_AI_ASSISTANT:-false}
      - LUX_LLM_BASE_URL=${LUX_LLM_BASE_URL:-}
      - LUX_LLM_API_KEY=${LUX_LLM_API_KEY:-}
      - LUX_LLM_MODEL=${LUX_LLM_MODEL:-qwen2.5:14b}
      # TLS terminates at nginx; app listens on plain HTTP (see TRUST_PROXY_TLS).
      - DISABLE_HTTPS=${DISABLE_HTTPS:-true}
      - TRUST_PROXY_TLS=${TRUST_PROXY_TLS:-true}
      - TLS_HOSTNAME=${TLS_HOSTNAME:-}
      - NODE_ENV=production
      - TZ=${TZ:-America/New_York}
    volumes:
      - ${SSH_KEY_PATH:-./ssh}:/app/ssh
      - ${DATA_DIR:-./data}:/app/data
      - ./skills:/app/skills:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional local LLM: docker compose --profile ollama up -d
  # Publishes host :11434. From ludus-ux use compose DNS (not host.docker.internal):
  #   http://ollama:11434/v1
  # host.docker.internal → published port often fails on Linux Docker (hairpin NAT).
  # GPU (NVIDIA): requires host nvidia-container-toolkit — see docs/assistant.md § GPU.
  # Without the toolkit, remove `gpus:` below (CPU fallback) or Compose will fail to start.
  ollama:
    profiles: ["ollama"]
    image: ollama/ollama:latest
    container_name: ludus-ux-ollama
    restart: unless-stopped
    ports:
      - "${LUX_OLLAMA_HOST_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama/entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    gpus: all
    environment:
      # Listen on all interfaces so other containers / host-published port can reach it
      - OLLAMA_HOST=0.0.0.0:11434
      - LUX_OLLAMA_DEFAULT_MODEL=${LUX_LLM_MODEL:-qwen2.5:14b}
      - NVIDIA_VISIBLE_DEVICES=${LUX_OLLAMA_NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - TZ=${TZ:-America/New_York}
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 600s

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    container_name: ludus-ux-web
    restart: unless-stopped
    ports:
      - "443:443"
    volumes:
      - ./docker/nginx/certificates:/etc/nginx/certs
    environment:
      - TLS_HOSTNAME=${TLS_HOSTNAME:-}
      - LUDUS_SSH_HOST=${LUDUS_SSH_HOST}
      - LUDUS_SERVER_IP=${LUDUS_SERVER_IP:-}
      - TZ=${TZ:-America/New_York}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      ludus-ux:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://ludus-ux:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  ollama_data:
